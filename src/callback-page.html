<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Controller | $title</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px;
  font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f5f5;
  background: radial-gradient(ellipse at 50% 25%, #183626 0%, #101612 40%, #080b09 80%); }
main { width: min(100%, 620px); padding: 48px 32px; text-align: center; border-radius: 24px;
  background: #151b17; border: 1px solid #34483a; border-top: 3px solid #1ed760;
  box-shadow: 0 24px 80px #0007; }
.brand { margin: 0 0 32px; color: #1ed760; font-size: 14px; font-weight: 650;
  letter-spacing: .12em; text-transform: uppercase; }
.mark { width: 76px; height: 76px; margin: 0 auto 28px; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid #36754c; background: #183f28; color: #78e89d; }
.mark svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 3;
  stroke-linecap: round; stroke-linejoin: round; }
h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.2; letter-spacing: -.035em; }
.description { max-width: 400px; margin: 20px auto 0; color: #c3cdc6; font-size: 18px; line-height: 1.6; }
.closing { min-height: 70px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #344039;
  color: #b4c2b8; font-size: 15px; line-height: 1.5; }
.closing p { margin: 0; }
noscript { display: block; margin-top: 12px; color: #c3cdc6; }
.rejected .mark { background: #3a2721; border-color: #825547; color: #f4b6a2; }
@media (max-width: 420px) { main { padding: 36px 20px; } .description { font-size: 17px; } }
</style>
</head>
<body>
<main class="$state" aria-labelledby="heading">
  <p class="brand">Spotify Controller</p>
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32">$icon</svg></div>
  <h1 id="heading">$title</h1>
  <p class="description">$description</p>
  <div class="closing"><p id="close-status" role="status">$status</p></div>
  <noscript>$noscript</noscript>
</main>
<script>$script</script>
</body>
</html>
